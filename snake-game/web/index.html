<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connor's Arcade Snake 🐍</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    header {
      margin-bottom: 12px;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      color: #4ade80;
      text-shadow: 0 0 16px rgba(74, 222, 128, 0.6);
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 1rem;
      margin-top: 4px;
    }
    .game-wrapper {
      position: relative;
      border: 4px solid #ef4444;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
      background: #090d16;
    }
    canvas {
      display: block;
      background: #0f172a;
      border-radius: 8px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      padding: 10px 20px;
      background: #1e293b;
      border-bottom: 2px solid #334155;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .score-badge { color: #f8fafc; }
    .level-badge { color: #22d3ee; }
    .high-badge { color: #facc15; }
    .level-alert {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(250, 204, 21, 0.95);
      color: #0f172a;
      font-weight: 900;
      font-size: 1.6rem;
      padding: 12px 28px;
      border-radius: 999px;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.8);
      display: none;
      pointer-events: none;
      animation: pulse 0.5s infinite alternate;
    }
    @keyframes pulse {
      from { transform: translate(-50%, -50%) scale(1); }
      to { transform: translate(-50%, -50%) scale(1.08); }
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      text-align: center;
      padding: 20px;
    }
    .overlay h2 {
      font-size: 3rem;
      color: #ef4444;
      margin-bottom: 12px;
      text-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
    }
    .overlay p {
      font-size: 1.3rem;
      color: #facc15;
      margin-bottom: 20px;
    }
    .btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6);
    }
    .mobile-controls {
      display: none;
      margin-top: 14px;
      grid-template-columns: repeat(3, 60px);
      grid-gap: 8px;
    }
    @media (max-width: 768px) {
      .mobile-controls {
        display: grid;
      }
    }
    .d-btn {
      width: 60px;
      height: 60px;
      background: #334155;
      border: 2px solid #475569;
      color: white;
      font-size: 1.4rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
  </style>
</head>
<body>

  <header>
    <h1>Connor's Arcade Snake 🐍</h1>
    <p class="subtitle">Designed by Game Director Connor • Arrow Keys or WASD</p>
  </header>

  <div class="game-wrapper">
    <div class="hud">
      <span class="score-badge">SCORE: <span id="scoreDisplay">0</span></span>
      <span class="level-badge">⭐ LEVEL: <span id="levelDisplay">1</span></span>
      <span class="high-badge">🏆 HIGH: <span id="highDisplay">0</span></span>
    </div>
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div id="levelAlert" class="level-alert">⚡ LEVEL UP! SPEED BOOST! ⚡</div>
    <div id="overlay" class="overlay">
      <h2>💥 GAME OVER 💥</h2>
      <p id="finalScoreDisplay">Final Score: 0</p>
      <button class="btn" onclick="resetGame()">Play Again</button>
    </div>
  </div>

  <div class="mobile-controls">
    <div></div>
    <button class="d-btn" onclick="sendDirection(0, -1)">⬆️</button>
    <div></div>
    <button class="d-btn" onclick="sendDirection(-1, 0)">⬅️</button>
    <button class="d-btn" onclick="sendDirection(0, 1)">⬇️</button>
    <button class="d-btn" onclick="sendDirection(1, 0)">➡️</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const levelDisplay = document.getElementById('levelDisplay');
    const highDisplay = document.getElementById('highDisplay');
    const overlay = document.getElementById('overlay');
    const levelAlert = document.getElementById('levelAlert');
    const finalScoreDisplay = document.getElementById('finalScoreDisplay');

    const GRID = 20;
    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 0, y: 0 };
    let score = 0;
    let level = 1;
    let highScore = 0;
    let gameOver = false;
    let gameLoopTimeout = null;

    function getSpeedInterval() {
      // Starts gentle at 7 FPS (142ms) and speeds up each level!
      const fps = 7 + (level - 1) * 1.5;
      return 1000 / fps;
    }

    function spawnFood() {
      while (true) {
        const fx = Math.floor(Math.random() * (WIDTH / GRID)) * GRID;
        const fy = Math.floor(Math.random() * (HEIGHT / GRID)) * GRID;
        const collision = snake.some(s => s.x === fx && s.y === fy);
        if (!collision) {
          return { x: fx, y: fy };
        }
      }
    }

    function resetGame() {
      overlay.style.display = 'none';
      levelAlert.style.display = 'none';
      const mid = Math.floor((WIDTH / 2) / GRID) * GRID;
      snake = [
        { x: mid, y: mid },
        { x: mid - GRID, y: mid },
        { x: mid - 2 * GRID, y: mid }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      food = spawnFood();
      score = 0;
      level = 1;
      scoreDisplay.textContent = score;
      levelDisplay.textContent = level;
      gameOver = false;
      if (gameLoopTimeout) clearTimeout(gameLoopTimeout);
      scheduleNextStep();
    }

    function scheduleNextStep() {
      if (gameOver) return;
      gameLoopTimeout = setTimeout(() => {
        gameStep();
        scheduleNextStep();
      }, getSpeedInterval());
    }

    function sendDirection(dx, dy) {
      if (gameOver) {
        resetGame();
        return;
      }
      if (dx !== 0 && dir.x === 0) nextDir = { x: dx, y: 0 };
      if (dy !== 0 && dir.y === 0) nextDir = { x: 0, y: dy };
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' && gameOver) {
        resetGame();
        return;
      }
      if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W')) sendDirection(0, -1);
      if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S')) sendDirection(0, 1);
      if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A')) sendDirection(-1, 0);
      if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D')) sendDirection(1, 0);
    });

    function showLevelUpAlert() {
      levelAlert.textContent = `⚡ LEVEL ${level}! SPEED BOOST! ⚡`;
      levelAlert.style.display = 'block';
      setTimeout(() => {
        levelAlert.style.display = 'none';
      }, 1500);
    }

    function gameStep() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x * GRID, y: snake[0].y + dir.y * GRID };

      // Solid Walls Collision
      if (head.x < 0 || head.x >= WIDTH || head.y < 0 || head.y >= HEIGHT) {
        triggerGameOver();
        return;
      }

      // Self Collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        triggerGameOver();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreDisplay.textContent = score;
        if (score > highScore) {
          highScore = score;
          highDisplay.textContent = highScore;
        }

        // Check Level Up every 50 points
        const newLevel = 1 + Math.floor(score / 50);
        if (newLevel > level) {
          level = newLevel;
          levelDisplay.textContent = level;
          showLevelUpAlert();
        }

        food = spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function triggerGameOver() {
      gameOver = true;
      if (gameLoopTimeout) clearTimeout(gameLoopTimeout);
      finalScoreDisplay.textContent = `Final Score: ${score} | Reached Level ${level}`;
      overlay.style.display = 'flex';
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Draw Food (Apple)
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(food.x + GRID / 2, food.y + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Food leaf
      ctx.fillStyle = '#65a30d';
      ctx.beginPath();
      ctx.arc(food.x + GRID / 2 + 2, food.y + 4, 3, 0, Math.PI * 2);
      ctx.fill();

      // Draw Snake
      snake.forEach((part, index) => {
        if (index === 0) {
          ctx.fillStyle = '#4ade80';
          ctx.beginPath();
          ctx.roundRect(part.x + 1, part.y + 1, GRID - 2, GRID - 2, 6);
          ctx.fill();

          // Eyes
          ctx.fillStyle = '#0f172a';
          let e1 = { x: part.x + 5, y: part.y + 5 };
          let e2 = { x: part.x + GRID - 5, y: part.y + 5 };
          if (dir.x > 0) {
            e1 = { x: part.x + GRID - 5, y: part.y + 5 };
            e2 = { x: part.x + GRID - 5, y: part.y + GRID - 5 };
          } else if (dir.x < 0) {
            e1 = { x: part.x + 5, y: part.y + 5 };
            e2 = { x: part.x + 5, y: part.y + GRID - 5 };
          } else if (dir.y > 0) {
            e1 = { x: part.x + 5, y: part.y + GRID - 5 };
            e2 = { x: part.x + GRID - 5, y: part.y + GRID - 5 };
          }
          ctx.beginPath();
          ctx.arc(e1.x, e1.y, 2.5, 0, Math.PI * 2);
          ctx.arc(e2.x, e2.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#22c55e';
          ctx.beginPath();
          ctx.roundRect(part.x + 1, part.y + 1, GRID - 2, GRID - 2, 4);
          ctx.fill();
        }
      });
    }

    resetGame();
  </script>
</body>
</html>
